[project]
name = "appcr-to-helmrelease-converter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.3",
    "click==8.3.3",
    "kubernetes==35.0.0",
    "rich==15.0.0",
]

[project.scripts]
appcr-to-helmrelease-converter = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "main.py",
    "converter/**",
    "fetcher/**",
    "migrator/**",
    "preflight/**",
    "resolver/**",
]

[tool.hatch.build.targets.wheel]
packages = ["converter", "fetcher", "migrator", "preflight", "resolver"]
force-include = { "main.py" = "main.py" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["main", "converter", "preflight", "fetcher", "migrator", "resolver"]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
